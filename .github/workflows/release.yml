name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: build release artifacts & publish release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Verify formatting and lints
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test --all-targets

      - name: Build release packages (.deb, .rpm)
        run: bash packaging/build-packages.sh

      - name: Prepare prebuilt release binary
        run: |
          cp target/release/dockd dist/dockd-linux-x86_64
          chmod +x dist/dockd-linux-x86_64

      - name: Generate SHA256SUMS
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum dockd* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
